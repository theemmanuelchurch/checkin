<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card { width: 100%; max-width: 420px; }

    h1 {
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    .date { font-size: 0.95rem; opacity: 0.7; margin-bottom: 32px; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: transparent;
      border: 1px solid #fff;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      padding: 14px 16px;
      margin-bottom: 20px;
      outline: none;
    }

    input:focus { border-width: 2px; padding: 13px 15px; }
    input::placeholder { color: rgba(255,255,255,0.4); }

    /* Honeypot: hidden from people, visible to bots */
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

    #turnstile { margin-bottom: 12px; }

    button {
      width: 100%;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 16px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: default; }

    .confirm { margin-top: 24px; text-align: center; font-weight: 600; min-height: 1.5em; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Check In</h1>
    <p class="date" id="dateDisplay"></p>

    <form id="checkinForm" novalidate>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" maxlength="100" autocomplete="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" maxlength="254" autocomplete="email" required>

      <div class="hp" aria-hidden="true">
        <label for="website">Website</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <div id="turnstile"></div>

      <button type="submit">I'm here</button>
    </form>

    <p class="confirm" id="confirm" role="status"></p>
  </main>

  <script>
    // Your Cloudflare Worker URL (safe to be public)
    const WORKER_URL = 'PASTE_YOUR_WORKER_URL_HERE';
    // Optional: Cloudflare Turnstile site key. Leave blank to skip the CAPTCHA.
    const TURNSTILE_SITE_KEY = '';

    document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    let turnstileId = null;
    if (TURNSTILE_SITE_KEY) {
      window.onTurnstileLoad = () => {
        turnstileId = turnstile.render('#turnstile', { sitekey: TURNSTILE_SITE_KEY, theme: 'dark' });
      };
      const s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit';
      s.async = true;
      document.head.appendChild(s);
    }

    const form = document.getElementById('checkinForm');
    const button = form.querySelector('button');
    const confirmEl = document.getElementById('confirm');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!form.reportValidity()) return;

      const name = document.getElementById('name').value.trim();
      const payload = {
        name,
        email: document.getElementById('email').value.trim(),
        website: document.getElementById('website').value,
        turnstileToken: turnstileId !== null ? turnstile.getResponse(turnstileId) : ''
      };

      button.disabled = true;
      button.textContent = 'Checking in…';
      confirmEl.textContent = '';

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const out = await res.json();
        if (out.ok) {
          const time = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
          confirmEl.textContent = `Thanks, ${name}! Checked in at ${time}.`;
          form.reset();
        } else {
          confirmEl.textContent = out.error || 'Something went wrong. Please try again.';
        }
      } catch {
        confirmEl.textContent = 'Something went wrong. Please try again.';
      } finally {
        if (turnstileId !== null) turnstile.reset(turnstileId);
        button.disabled = false;
        button.textContent = "I'm here";
      }
    });
  </script>
</body>
</html>
